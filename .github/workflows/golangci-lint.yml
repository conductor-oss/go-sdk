name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          
      # The action's own new-issues filter asks GitHub for the pull request's
      # patch, and that API refuses a diff over 20,000 lines. When it does,
      # the filter is silently dropped and the whole repository is linted,
      # failing on findings the change never touched. Comparing against the
      # merge base with git instead needs no API call and no size limit.
      - name: Fetch the base branch for the merge-base comparison
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.3
          only-new-issues: ${{ github.event_name != 'pull_request' }}
          args: --timeout 10m --issues-exit-code=1 ${{ github.event_name == 'pull_request' && format('--new-from-merge-base=origin/{0}', github.base_ref) || '' }}