name: Integration + Backward Compatibility Tests (sdkdev cluster)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests-sdkdev:
    runs-on: ubuntu-latest

    env:
      CONDUCTOR_SERVER_URL: ${{ secrets.CONDUCTOR_SERVER_URL }}
      CONDUCTOR_AUTH_KEY: ${{ secrets.KEY }}
      CONDUCTOR_AUTH_SECRET: ${{ secrets.SECRET }}

    permissions:
      contents: read       # minimal read access
      checks: write        # needed for test report annotations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run Integration tests (sdkdev cluster)
        run: |
          gotestsum --format testname --junitfile report.xml --rerun-fails=3 --rerun-fails-report=rerun-report.txt --packages="./test/integration_tests/..." -- -v -count=1

      - name: Publish test results (sdkdev cluster)
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Integration tests report (sdkdev cluster)
          path: report.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: true

      - name: Append rerun details to Summary
        if: always()
        run: |
          if [ -f rerun-report.txt ]; then
            {
              echo "### Rerun details"
              echo '```'
              cat rerun-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-and-reruns
          path: |
            report.xml
            rerun-report.txt
          if-no-files-found: warn

      - name: Run Backward Compatibility Tests (sdkdev cluster)
        id: compat_tests
        run: |
          echo "🚀 Starting Backward Compatibility Tests..."
          cd test/backward_compatibility
          chmod +x run_compatibility.sh
          
          # Run with retry logic - attempt up to 3 times
          MAX_ATTEMPTS=3
          ATTEMPT=1
          SUCCESS=false
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ] && [ "$SUCCESS" = "false" ]; do
            if [ $ATTEMPT -gt 1 ]; then
              echo "🔄 Retry attempt $ATTEMPT/$MAX_ATTEMPTS for backward compatibility tests"
            fi
            
            if ./run_compatibility.sh; then
              SUCCESS=true
              echo "✅ Backward compatibility tests passed on attempt $ATTEMPT"
            else
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "❌ Backward compatibility tests failed on attempt $ATTEMPT. Retrying in 5 seconds..."
                sleep 5
              else
                echo "❌ Backward compatibility tests failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
            fi
            
            ATTEMPT=$((ATTEMPT+1))
          done
          
          # Add compatibility test retry information to GitHub summary
          if [ "$SUCCESS" = "true" ] && [ $ATTEMPT -gt 2 ]; then
            {
              echo "### Backward Compatibility Tests Retry Summary"
              echo "✅ Tests passed after $((ATTEMPT-1)) attempts"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
