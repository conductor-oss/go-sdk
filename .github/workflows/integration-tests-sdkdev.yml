name: Integration + Backward Compatibility Tests (sdkdev cluster)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests-sdkdev:
    runs-on: ubuntu-latest

    env:
      CONDUCTOR_SERVER_URL: ${{ secrets.CONDUCTOR_SERVER_URL }}
      CONDUCTOR_AUTH_KEY: ${{ secrets.KEY }}
      CONDUCTOR_AUTH_SECRET: ${{ secrets.SECRET }}

    permissions:
      contents: read       # minimal read access
      checks: write        # needed for test report annotations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run Integration tests (sdkdev cluster)
        run: |
          gotestsum --format testname --junitfile report.xml --rerun-fails=3 --rerun-fails-report=rerun-report.xml --packages="./test/integration_tests/..." -- -v -count=1

      - name: Publish test results (sdkdev cluster)
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Integration tests report (sdkdev cluster)
          path: report.xml,rerun-report.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: true

      - name: Run Backward Compatibility Tests (sdkdev cluster)
        run: |
          echo "🚀 Starting Backward Compatibility Tests..."
          cd test/backward_compatibility
          chmod +x run_compatibility.sh
          ./run_compatibility.sh
