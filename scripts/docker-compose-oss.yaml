# Conductor OSS stack used to run the SDK integration tests against open-source
# Conductor. Shared by scripts/run-integration-oss.sh and the
# integration-tests-oss job in .github/workflows/integration-tests-sm.yml.
#
# The `image:` default below is the SINGLE place the Conductor OSS image tag is
# written. Everything that does not override OSS_CONDUCTOR_VERSION lands on it:
# a plain scripts/run-integration-oss.sh run, and the integration-tests-oss job
# on a fork PR (where GitHub withholds org variables). Overrides are the
# script's --version flag and, in CI, the E2E_TEST_OSS_CONDUCTOR_VERSION org
# variable or a workflow_dispatch input. Bump the tag here and both follow.
#
# The org variable is currently set to `latest`, so a normal CI run still tracks
# whatever `latest` resolves to at run time; this default is what actually pins
# fork PRs and local runs until someone sets it to a real tag.
#
# Mind the tag you pick: this suite has no version gating on OSS (see
# testdata.RequireAtLeast, which returns early when IsOSS() because Orkes
# Enterprise version numbers are unrelated to OSS's). OSS gaps are gated
# per-test via SkipIfOSS/OSSGapSkipped on empirical evidence, not on a version
# threshold -- so an image older than something the suite exercises surfaces as
# a test failure, never as a skip.
#
# httpbin: a handful of integration tests exercise the HTTP task type against
# a fixed "http://httpbin:8081/..." URL (hardcoded in test fixtures/JSON
# workflow defs, not configurable). This service exists purely to give that
# hostname something to resolve to on the compose network. Pinned to the same
# tag python-sdk uses, so the two suites exercise identical behavior.
services:
  conductor-server:
    image: conductoross/conductor:${OSS_CONDUCTOR_VERSION:-3.32.3}
    environment:
      - CONFIG_PROP=config-postgres.properties
      # Dummy, non-sensitive value so OSS's bundled env-backed SecretsDAO has
      # something real to read back in TestSecretReads (get/list/exists --
      # writes are 501 on that read-only backend). OSS Conductor has
      # no authentication at all, so an unauthenticated /api/secrets/{key}
      # read doesn't change the threat model versus any other unauthenticated
      # OSS endpoint -- don't put a real credential here. Keep the name and
      # value in sync with ossSeededSecretName/Value in
      # test/integration_tests/secret_client_test.go.
      - CONDUCTOR_SECRET_GO_SDK_INTEGRATION_TEST=go-sdk-oss-secret-value
      # Needed by TestParallelExecutionIntegration (FORK_JOIN, 7s budget).
      #
      # OSS decides a workflow inline when a task completes, EXCEPT when
      # WorkflowExecutorOps.isLazyEvaluateWorkflow() returns true -- which it
      # does for a task inside a FORK_JOIN that some JOIN's joinOn lists and
      # that succeeded. That test's join_ref joins on all four branch tasks
      # (including the intermediate ones), so completing a branch head skips
      # the inline decide and the branch continuation waits for the sweeper.
      # Orkes Enterprise has no such check -- OrkesWorkflowExecutor.updateTask
      # always dispatches the decide -- which is why the same workflow
      # definition completes sub-second there.
      #
      # This value is the postpone on the workflow's _deciderQueue message,
      # i.e. how long before WorkflowSweeper can pop it and call decide() --
      # NOT a sweep interval; the sweeper threads poll continuously. 30s is the
      # default and this image's config-postgres.properties does not set it.
      # Shortened so a parked workflow becomes sweepable in ~1s. Changes only
      # when the server re-decides, no SDK behavior.
      - CONDUCTOR_APP_WORKFLOWOFFSETTIMEOUT=1s
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 20
    links:
      - conductor-postgres:postgresdb
    depends_on:
      conductor-postgres:
        condition: service_healthy
  conductor-postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=conductor
      - POSTGRES_PASSWORD=conductor
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432'
      interval: 5s
      timeout: 5s
      retries: 12
  httpbin:
    image: ghcr.io/conductor-oss/httpbin:v1.0.1
    expose:
      - "8081"
