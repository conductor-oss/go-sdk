        bulkErrorResults:
          additionalProperties:
            type: string
          type: object
        bulkSuccessfulResults:
          items:
            type: string
          type: array
      type: object
    CacheConfig:
      example:
        key: key
        ttlInSecond: 9
      properties:
        key:
          type: string
        ttlInSecond:
          format: int32
          type: integer
      type: object
    RateLimitConfig:
      example:
        concurrentExecLimit: 9
        rateLimitKey: rateLimitKey
      properties:
        rateLimitKey:
          type: string
        concurrentExecLimit:
          format: int32
          type: integer
      type: object
    SchemaDef:
      example:
        updatedBy: updatedBy
        data:
          key: "{}"
        createTime: 1
        createdBy: createdBy
        name: name
        updateTime: 4
        type: JSON
        version: 5
        externalRef: externalRef
        ownerApp: ownerApp
      properties:
        ownerApp:
          type: string
        createTime:
          format: int64
          type: integer
        updateTime:
          format: int64
          type: integer
        createdBy:
          type: string
        updatedBy:
          type: string
        name:
          type: string
        version:
          format: int32
          type: integer
        type:
          enum:
          - JSON
          - AVRO
          - PROTOBUF
          type: string
        data:
          additionalProperties:
